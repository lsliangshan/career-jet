<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AI 绘本生成器</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      :root {
        --primary: #6366f1;
        --secondary: #22c55e;
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      header {
        padding: 24px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: 28px;
      }

      header p {
        margin-top: 8px;
        opacity: 0.9;
      }

      main {
        max-width: 1200px;
        margin: 24px auto;
        padding: 0 16px 48px;
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 24px;
      }

      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }

      .card h2 {
        margin-top: 0;
        font-size: 18px;
        margin-bottom: 16px;
      }

      .form-group {
        margin-bottom: 14px;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        color: var(--muted);
      }

      input[type="text"],
      input[type="number"],
      select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #e5e7eb;
        outline: none;
        font-size: 14px;
      }

      input:focus,
      select:focus {
        border-color: var(--primary);
      }

      .switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .switch input {
        display: none;
      }

      .slider {
        width: 42px;
        height: 22px;
        background: #e5e7eb;
        border-radius: 999px;
        position: relative;
        cursor: pointer;
        transition: 0.2s;
      }

      .slider::after {
        content: "";
        width: 18px;
        height: 18px;
        background: white;
        border-radius: 50%;
        position: absolute;
        top: 2px;
        left: 2px;
        transition: 0.2s;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }

      .switch input:checked + .slider {
        background: var(--primary);
      }

      .switch input:checked + .slider::after {
        transform: translateX(20px);
      }

      .actions {
        margin-top: 20px;
        text-align: center;
      }

      .btn {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 15px;
        box-shadow: 0 10px 20px rgba(99, 102, 241, 0.35);
      }

      .btn:hover {
        opacity: 0.95;
      }

      .loading {
        display: none;
        text-align: center;
        padding: 40px 0;
        color: var(--muted);
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid #e5e7eb;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 12px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .result {
        display: none;
      }

      .story-box {
        background: #f9fafb;
        border-radius: 12px;
        padding: 16px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 14px;
        margin-top: 14px;
      }

      .img-card {
        background: #f3f4f6;
        border-radius: 12px;
        padding: 8px;
        text-align: center;
      }

      .img-card img {
        width: 100%;
        border-radius: 10px;
      }

      .img-card p {
        font-size: 12px;
        margin: 6px 0 0;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>📚 AI 绘本生成器</h1>
      <p>配置主题、风格与角色，一键生成你的专属绘本</p>
    </header>

    <main>
      <!-- 配置表单 -->
      <div class="card">
        <h2>绘本配置</h2>

        <div class="form-group">
          <label>主题 (Theme)</label>
          <input type="text" id="theme" placeholder="例如：勇敢的小兔子" />
        </div>

        <div class="form-group">
          <label>故事风格</label>
          <select id="storyStyle">
            <option>温馨</option>
            <option>冒险</option>
            <option>幽默</option>
            <option>科幻</option>
            <option>教育</option>
          </select>
        </div>

        <div class="form-group">
          <label>图画风格</label>
          <select id="pictureStyle">
            <option>水彩</option>
            <option>卡通</option>
            <option>油画</option>
            <option>日系绘本</option>
            <option>像素风</option>
          </select>
        </div>

        <div class="form-group">
          <label>故事长度（页）</label>
          <input type="number" id="length" value="10" min="1" />
        </div>

        <div class="form-group">
          <label>故事语言</label>
          <select id="language">
            <option>中文</option>
            <option>English</option>
            <option>中英双语</option>
          </select>
        </div>

        <div class="form-group">
          <label>角色个数</label>
          <input type="number" id="roleCount" value="2" min="1" />
        </div>

        <div class="form-group">
          <label>场景个数</label>
          <input type="number" id="sceneCount" value="5" min="1" />
        </div>

        <div class="form-group">
          <label>绘本比例</label>
          <select id="ratio">
            <option>1:1</option>
            <option>4:3</option>
            <option>16:9</option>
            <option>3:4</option>
          </select>
        </div>

        <div class="form-group switch">
          <label>自动确认故事内容</label>
          <label>
            <input type="checkbox" id="autoConfirmedStory" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="form-group switch">
          <label>自动确认故事角色</label>
          <label>
            <input type="checkbox" id="autoConfirmedRole" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="form-group switch">
          <label>自动确认故事场景</label>
          <label>
            <input type="checkbox" id="autoConfirmedScene" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="actions">
          <button class="btn" onclick="generateStory()">✨ 生成绘本</button>
        </div>
      </div>

      <!-- 生成 & 结果 -->
      <div class="card">
        <h2>生成结果</h2>

        <div class="loading" id="loading">
          <div class="spinner"></div>
          正在生成绘本内容，请稍候…
        </div>

        <div class="result" id="result">
          <h3>📖 故事内容</h3>
          <div class="story-box" id="storyText"></div>

          <h3>🎭 故事角色</h3>
          <div class="grid" id="roles"></div>

          <h3>🌄 故事场景</h3>
          <div class="grid" id="scenes"></div>
        </div>
      </div>
    </main>

    <script>
      function generateStory() {
        const loading = document.getElementById("loading");
        const result = document.getElementById("result");

        loading.style.display = "block";
        result.style.display = "none";

        setTimeout(() => {
          loading.style.display = "none";
          result.style.display = "block";

          document.getElementById("storyText").textContent =
            "从前，在一片安静的森林里，住着一只勇敢的小兔子。\n\n" +
            "它每天都梦想着去看看森林外面的世界。\n\n" +
            "终于有一天，它踏上了属于自己的冒险旅程……";

          const roles = document.getElementById("roles");
          roles.innerHTML = "";
          for (let i = 1; i <= 3; i++) {
            roles.innerHTML += `
            <div class="img-card">
              <img src="https://placehold.co/300x300?text=角色${i}" />
              <p>角色 ${i}</p>
            </div>`;
          }

          const scenes = document.getElementById("scenes");
          scenes.innerHTML = "";
          for (let i = 1; i <= 4; i++) {
            scenes.innerHTML += `
            <div class="img-card">
              <img src="https://placehold.co/400x300?text=场景${i}" />
              <p>场景 ${i}</p>
            </div>`;
          }
        }, 1800);
      }
    </script>
  </body>
</html>
