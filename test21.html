<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AI 绘本生成</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />

    <style>
      :root {
        --primary: #7c7cff;
        --pink: #ff8fab;
        --orange: #ffb703;
        --bg: #f7f8ff;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #94a3b8;
        --radius: 22px;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* ===== Header ===== */
      header {
        padding: 28px 20px 36px;
        background: radial-gradient(
            circle at top left,
            #a5b4fc,
            transparent 60%
          ),
          linear-gradient(135deg, #7c7cff, #8b5cf6);
        color: #fff;
        border-bottom-left-radius: 32px;
        border-bottom-right-radius: 32px;
      }

      header h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }

      header p {
        margin: 10px 0 0;
        font-size: 14px;
        opacity: 0.95;
      }

      /* ===== Main ===== */
      main {
        padding: 16px;
      }

      /* ===== Card ===== */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 18px;
        margin-bottom: 18px;
        box-shadow: 0 10px 30px rgba(124, 124, 255, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
      }

      .card h2 {
        margin: 0 0 16px;
        font-size: 17px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* ===== Form ===== */
      .form-group {
        margin-bottom: 14px;
      }

      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input,
      select {
        width: 100%;
        padding: 14px;
        border-radius: 16px;
        border: 1px solid #e5e7eb;
        font-size: 15px;
        background: #fafafa;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        background: #fff;
      }

      /* ===== Switch ===== */
      .switch-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        background: #f8fafc;
        border-radius: 16px;
        margin-bottom: 10px;
      }

      .switch-row span {
        font-size: 14px;
      }

      .switch {
        width: 50px;
        height: 28px;
        position: relative;
      }

      .switch input {
        display: none;
      }

      .slider {
        position: absolute;
        inset: 0;
        background: #e5e7eb;
        border-radius: 999px;
        transition: 0.3s;
      }

      .slider::after {
        content: "";
        width: 22px;
        height: 22px;
        background: white;
        border-radius: 50%;
        position: absolute;
        top: 3px;
        left: 3px;
        transition: 0.3s;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      }

      .switch input:checked + .slider {
        background: linear-gradient(135deg, #7c7cff, #a78bfa);
      }

      .switch input:checked + .slider::after {
        transform: translateX(22px);
      }

      /* ===== Button ===== */
      .btn {
        width: 100%;
        padding: 16px;
        margin-top: 10px;
        border: none;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background: radial-gradient(
            circle at top left,
            #c7d2fe,
            transparent 60%
          ),
          linear-gradient(135deg, #7c7cff, #8b5cf6);
        box-shadow: 0 18px 40px rgba(124, 124, 255, 0.45);
      }

      .btn:active {
        transform: scale(0.97);
      }

      /* ===== Loading ===== */
      .loading {
        display: none;
        text-align: center;
        padding: 32px 0;
      }

      .spinner {
        width: 42px;
        height: 42px;
        margin: 0 auto 14px;
        border: 4px solid #e5e7eb;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ===== Result ===== */
      .result {
        display: none;
      }

      .story-box {
        background: linear-gradient(180deg, #ffffff, #f8fafc);
        padding: 16px;
        border-radius: 18px;
        line-height: 1.8;
        font-size: 15px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        margin-top: 14px;
      }

      .img-card {
        background: linear-gradient(180deg, #ffffff, #f3f4f6);
        border-radius: 18px;
        padding: 8px;
        text-align: center;
      }

      .img-card img {
        width: 100%;
        border-radius: 14px;
      }

      .img-card p {
        margin: 6px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>

  <body>
    <header>
      <h1>📖 魔法绘本工坊</h1>
      <p>为孩子生成一个温柔又有想象力的故事</p>
    </header>

    <main>
      <div class="card">
        <h2>🪄 绘本配置</h2>

        <div class="form-group">
          <label>故事主题</label>
          <input placeholder="如：不怕黑的小熊" />
        </div>

        <div class="form-group">
          <label>故事风格</label>
          <select>
            <option>温馨</option>
            <option>冒险</option>
            <option>幽默</option>
            <option>治愈</option>
          </select>
        </div>

        <div class="form-group">
          <label>图画风格</label>
          <select>
            <option>水彩</option>
            <option>卡通</option>
            <option>日系绘本</option>
            <option>油画</option>
          </select>
        </div>

        <div class="form-group">
          <label>故事长度（页）</label>
          <input type="number" value="10" />
        </div>

        <div class="form-group">
          <label>语言</label>
          <select>
            <option>中文</option>
            <option>English</option>
            <option>中英双语</option>
          </select>
        </div>

        <div class="form-group">
          <label>角色个数</label>
          <input type="number" value="2" />
        </div>

        <div class="form-group">
          <label>场景个数</label>
          <input type="number" value="5" />
        </div>

        <div class="form-group">
          <label>绘本比例</label>
          <select>
            <option>1:1</option>
            <option>4:3</option>
            <option>16:9</option>
          </select>
        </div>

        <div class="switch-row">
          <span>自动确认故事内容</span>
          <label class="switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-row">
          <span>自动确认角色</span>
          <label class="switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-row">
          <span>自动确认场景</span>
          <label class="switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>

        <button class="btn" onclick="generate()">✨ 生成绘本</button>
      </div>

      <div class="card loading" id="loading">
        <div class="spinner"></div>
        正在施展魔法生成故事…
      </div>

      <div class="card result" id="result">
        <h2>📖 故事预览</h2>
        <div class="story-box">
          从前，有一只胆小的小熊。 它害怕夜晚，却又渴望星空。
          在一次奇妙的冒险中，它学会了勇敢…
        </div>

        <h2 style="margin-top: 18px">🎭 角色</h2>
        <div class="grid">
          <div class="img-card">
            <img src="https://placehold.co/300x300?text=小熊" />
            <p>小熊</p>
          </div>
          <div class="img-card">
            <img src="https://placehold.co/300x300?text=小兔" />
            <p>小兔</p>
          </div>
        </div>

        <h2 style="margin-top: 18px">🌄 场景</h2>
        <div class="grid">
          <div class="img-card">
            <img src="https://placehold.co/400x300?text=森林" />
            <p>森林</p>
          </div>
          <div class="img-card">
            <img src="https://placehold.co/400x300?text=星空" />
            <p>星空</p>
          </div>
        </div>
      </div>
    </main>

    <script>
      function generate() {
        document.getElementById("loading").style.display = "block";
        document.getElementById("result").style.display = "none";

        setTimeout(() => {
          document.getElementById("loading").style.display = "none";
          document.getElementById("result").style.display = "block";
        }, 1800);
      }
    </script>
  </body>
</html>
